name = "halo-client-mapper"
main = "src/worker.ts"
compatibility_date = "2026-06-02"

# Only serve on routes/custom domains you attach in the dashboard (not workers.dev or preview URLs).
workers_dev = false
preview_urls = false

[vars]
APP_NAME = "Halo Client Mapper"

# Set via Cloudflare secrets:
#   wrangler secret put HALO_CLIENT_ID
#   wrangler secret put HALO_CLIENT_SECRET
#   wrangler secret put HALO_BASE_URL
# Optional tenant for hosted Halo (infer from URL host if omitted):
#   wrangler secret put HALO_TENANT
# Optional agent mailing-address custom field id (defaults to 297 if unset):
#   wrangler secret put HALO_AGENT_ADDRESS_FIELD_ID
